[package]
name = "nanokvm-usb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Native Linux client for the Sipeed NanoKVM-USB (CH9329 serial + UVC MJPEG)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chrishoage/NanoKVM-USB-rs"
homepage = "https://github.com/chrishoage/NanoKVM-USB-rs"
readme = "README.md"
keywords = ["kvm", "nanokvm", "ch9329", "wayland", "uvc"]
categories = ["command-line-utilities", "hardware-support"]

# Resolver 3 respects the declared MSRV when regenerating the lockfile.
resolver = "3"

[lib]
name = "nanokvm"
path = "src/lib.rs"

[[bin]]
name = "nanokvm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"

# Dry-run output names frames from the embedded TOML packet fixtures.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# Discovery uses sysfs directly, so libudev enumeration is unnecessary.
serialport = { version = "4", default-features = false }

# Use kernel V4L2 bindings without linking libv4l2.
v4l = { version = "0.14.0", default-features = false, features = ["v4l2"] }

zune-jpeg = "0.5.15"
zune-core = "0.5.3"

# PNG screenshots encode decoded RGBA; JPEG screenshots preserve device bytes.
png = "0.18"

# ALSA provides capture and host playback without requiring a sound-server API.
alsa = "0.12"

winit = "0.30.13"
# Keep wgpu compatible with egui-wgpu.
wgpu = "30.0"
raw-window-handle = "0.6.2"
pollster = "1.0"
bytemuck = { version = "1", features = ["derive"] }

# Share winit’s Wayland connection for shortcut inhibition.
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }

# Keep the egui crates on one compatible release line.
egui = "0.33"
# Only the renderer is needed; the viewer owns its surface and event loop.
egui-wgpu = { version = "0.33", default-features = false }
# Disable clipboard defaults to avoid a second Wayland backend that would break
# foreign-surface recognition. Clipboard access uses wl-clipboard-rs below.
egui-winit = { version = "0.33", default-features = false, features = ["wayland"] }

# Data-control clipboard reads work without transferring keyboard focus.
wl-clipboard-rs = "0.9.3"

[dev-dependencies]
proptest = "1"
# PTYs let transport tests exercise real serial I/O without hardware.
nix = { version = "0.31", features = ["term", "fs", "poll"] }
# Keep the UI test harness on the same egui release line.
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
# The test harness enables egui/accesskit, so egui-winit must enable its matching
# output field. Restrict this dependency tree to test builds.
egui-winit = { version = "0.33", default-features = false, features = ["wayland", "accesskit"] }

[features]
# Hardware tests must also be ignored so enabling this feature never runs them.
hardware = []

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
