[package]
name = "nanokvm-usb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Native Linux client for the Sipeed NanoKVM-USB (CH9329 serial + UVC MJPEG)"

# MSRV-aware dependency resolution, and it is load-bearing rather than tidy (§12 Stage 4b).
# `wgpu-hal` 27.0.4 deliberately loosened its `ordered-float` constraint ("Remove fragile
# dependency constraint on ordered-float that prevented semver-compatible changes above 5.0.0"),
# so the default resolver now walks to `ordered-float` 5.5.0 — whose `rust-version` is 1.90, above
# the 1.89 declared above and above the 1.89.0 on this desk — the moment the lock is regenerated.
# Resolver 3 reads `rust-version` and picks 5.4.0 instead ("Locking N packages to latest Rust 1.89
# compatible versions"). Preferred to a `--precise` lock pin that nothing in the tree explains, and
# it keeps working for the next crate that does this.
resolver = "3"

# One crate, lib + bin, no workspace. See docs/NATIVE_CLIENT_PLAN.md §4 and §7.
[lib]
name = "nanokvm"
path = "src/lib.rs"

[[bin]]
name = "nanokvm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"

# The §9.1 packet fixtures are read by the crate itself now, not just by tests: `script::dry_run`
# names the frames it prints from `fixtures/packets/ch9329.toml`.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# default-features = false drops the libudev enumeration dependency (§7.2).
serialport = { version = "4", default-features = false }

# Pure-v4l2 backend: bindgen over <linux/videodev2.h>, links nothing. The `libv4l`
# feature would pull libv4l2.so.0 -- never enable it (§7.2, A10).
v4l = { version = "0.14.0", default-features = false, features = ["v4l2"] }

# Decoder of record (§1.3, A19): RGBA output, strict mode, one thread.
zune-jpeg = "0.5.15"
zune-core = "0.5.3"

# `nanokvm shot foo.png` only. The device sends MJPEG and nothing else (§6, A1), so a `.jpg` shot
# is the device's own bytes and this never runs; a `.png` one encodes a single already-decoded
# RGBA frame. Default features, and deliberately not the `image` crate: one format, one call, and
# no decoders linked in that nothing here asks for.
png = "0.18"

# The one library §7.2 lets Stage 4a add to the link surface, and the reason the rule is now
# "link the four, dlopen nothing new": `alsa-sys` links `libasound`. Every candidate links
# something -- `cpal` links libasound too, a native PipeWire client links libpipewire-0.3 and
# needs the daemon, the PulseAudio simple API links libpulse -- and libasound is the smallest,
# is on any host with a sound card, and routes through `pipewire-alsa` on a PipeWire desk so we
# are an ordinary PipeWire client without linking PipeWire. Confined to `src/audio/alsa.rs`.
alsa = "0.12"

winit = "0.30.13"
# 26 → 27 is forced by the chrome (§12 Stage 4b): no egui release pins wgpu 26 — egui-wgpu 0.32
# wants ^25 and 0.33 wants ^27.0.1, and 26 was skipped entirely. Nothing in `viewer::render`
# changes for it; §5.3's present-mode enumeration was re-measured on this desk after the bump
# rather than assumed to carry (docs/STAGE4_FINDINGS.md).
wgpu = "27.0"
raw-window-handle = "0.6.2"
pollster = "1.0"
bytemuck = { version = "1", features = ["derive"] }

# Second wl_event_queue on winit's display for shortcut inhibit (§1.5).
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }

# The chrome (§12 Stage 4b). 0.33 is the last line that builds on rustc 1.89: 0.34 and 0.35 need
# 1.92 and 0.36 needs 1.95. It is also the line that pins wgpu 27, which is why the bump above is
# not optional.
egui = "0.33"
# `Renderer` only — we own the surface and draw egui into the video pass ourselves, so the
# `winit`-feature `Painter` is not wanted. Dropping the defaults also drops
# `macos-window-resize-jitter-fix`, which pulls `wgpu/metal` for nothing on Linux.
egui-wgpu = { version = "0.33", default-features = false }
# **The features here are load-bearing.** egui-winit's defaults are
# ["clipboard", "links", "wayland", "winit/default", "x11"]; `clipboard` pulls arboard *and*
# smithay-clipboard → smithay-client-toolkit 0.20 → calloop 0.14, a second SCTK/calloop beside
# winit's own — and with it a second `wayland-backend` build, which is precisely what
# `viewer::wayland`'s module docs say makes winit's foreign `wl_surface` proxy unrecognisable and
# silently kills shortcut inhibition (§1.5). `links` pulls `webbrowser`, and nothing here opens a
# URL. 4c takes the clipboard from `wl-clipboard-rs` instead. Verified after the bump:
# `cargo tree -d` reports no duplicate wayland/calloop/smithay crate and the lock has exactly one
# `wayland-backend`.
egui-winit = { version = "0.33", default-features = false, features = ["wayland"] }

# The clipboard source for §12 Stage 4c, over the data-control protocol — which needs no keyboard
# focus, and which niri advertises in both flavours (`ext_data_control_manager_v1 v1` and
# `zwlr_data_control_manager_v1 v2`, measured on this desk with a `wl_registry` roundtrip). 0.9.2
# added `ext-data-control` and prefers it when present. It is *not* `egui-winit`'s `clipboard`
# feature: that one pulls arboard + smithay-clipboard → a second SCTK/calloop/wayland-backend,
# which the comment above explains is what silently kills shortcut inhibition (§1.5). This crate
# opens its own short-lived connection instead and shares the tree's `wayland-client`.
wl-clipboard-rs = "0.9.3"

[dev-dependencies]
proptest = "1"
# openpty for the fake CH9329 (§9.3).
nix = { version = "0.31", features = ["term", "fs", "poll"] }
# Drives the chrome's widgets with no window and no compositor (§12 Stage 4b): AccessKit queries
# for "this control exists and its tooltip says why it is disabled", and a real wgpu render for
# the snapshot PNGs under tests/snapshots/. Pinned to the same 0.33 line as egui itself — a
# kittest from another line would link a second egui.
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
# **Not a second copy of the dependency — an extra feature, for tests only.** `egui_kittest` turns
# on `egui/accesskit`, and `egui-winit` 0.33.3 destructures `egui::PlatformOutput` exhaustively:
# with `egui/accesskit` on but its own `accesskit` feature off it fails to compile
# (`pattern does not mention field 'accesskit_update'`). Declaring the feature here rather than in
# `[dependencies]` is what keeps `accesskit_winit` — and the AT-SPI/zbus tree behind it — out of
# the shipped binary, which `cargo build` proves: dev-dependency features unify only when a test
# target is being built (resolver 2/3).
egui-winit = { version = "0.33", default-features = false, features = ["wayland", "accesskit"] }

[features]
# Tests that need the dongle and the target. Always #[ignore] as well; never gate CI (§9.3).
hardware = []

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
