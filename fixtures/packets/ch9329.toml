# --------------------------------------------------------------------------
# Where the wire disagreed with the documented frame format.
# Preserve the observation even when it violates the nominal frame format.
# --------------------------------------------------------------------------

[[disagreement]]
name = "unknown_command_reply_has_no_checksum_byte"
trigger = "57 AB 00 7E 00 80   (well-formed frame, undefined command 0x7E)"
derived_reply = "57 AB 00 FE 00 00   (6 bytes: CMD 0x7E|0x80, LEN 0x00, SUM = 0x102 + 0xFE + 0x00 = 0x200 -> & 0xFF = 0x00)"
observed_reply = "57 AB 00 FE 00      (5 bytes -- no SUM byte at all)"
note = """
The undefined command returned five bytes, omitting the checksum despite LEN=0.
No sixth byte arrived within either a 2 s or 10 s read window. A subsequent
GET_INFO received its own complete reply, excluding a merely late checksum.

The reader therefore needs a timeout and resynchronization path. Waiting only
for 6 + LEN bytes can block indefinitely on this response.
"""

[[disagreement]]
name = "device_receive_parser_has_no_inter_byte_timeout"
trigger = "57 AB 00 02 08 00 00   (header claims LEN=8, only 2 payload bytes sent)"
note = """
The chip kept waiting for six payload bytes and a checksum after gaps of
0, 100, 200, 300, 500, 1000, 2000, and 10000 ms. It consumed the next GET_INFO
as the unfinished payload, returned 57 AB 00 C2 01 E4 A9 (checksum error),
and resynchronized on the following request.

Complete-frame writes prevent this failure during normal operation. Reconnect
pads a potentially torn frame before commissioning; replies must still be
matched by command rather than assumed to belong to the latest request.
"""

[[disagreement]]
name = "mouse_reports_need_a_leading_mode_byte"
trigger = "57 AB 00 04 06 00 <xLo> <xHi> <yLo> <yHi> 00   (6-byte absolute payload without the required mode byte)"
derived_reply = "cursor moves to the requested position"
observed_reply = "57 AB 00 84 01 00 87  (ACK) with no cursor movement"
note = """
Hardware measurements confirmed a required leading mode byte:
    SEND_MS_ABS_DATA (0x04), LEN=7: [0x02, buttons, xLo, xHi, yLo, yHi, wheel]
    SEND_MS_REL_DATA (0x05), LEN=5: [0x01, buttons, dx, dy, wheel]

The upstream mouse helpers describe HID-shaped payloads without that byte;
the absolute.tsx and relative.tsx send sites prepend it. Omitting it from an
absolute report still receives 57 AB 00 84 01 00 87, but the cursor does not
move. A short relative report shifts interpretation: host dy becomes target
dx, and host wheel becomes target dy. Both effects were observed on hardware.

Acknowledgement alone cannot verify input. Assert payload lengths and mode
bytes against these fixtures, and use captured target effects for hardware
validation. See fixtures/frames/absrange/MANIFEST.md.
"""
