# --------------------------------------------------------------------------
# Responses. Same framing rule; CMD is request | 0x80 on success and
# request | 0xC0 on error. Included so the DECODE side has an authority too.
# --------------------------------------------------------------------------

[[response]]
name = "get_info_reply"
cmd = 0x81
payload_meaning = "GET_INFO reply, 8 bytes: [versionChar, connectedFlag, lockBits, 0,0,0,0,0]. versionChar 0x38 ('8') => version = 1.0 + (0x38-0x30)/10 = 1.8. connectedFlag 0x01 = target enumerated the emulated HID. lockBits 0x00 = NumLock(bit0)/CapsLock(bit1)/ScrollLock(bit2) all off."
data = [0x38, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
len = 0x08
frame = "57 AB 00 81 08 38 01 00 00 00 00 00 00 C4"
checksum = 0xC4
checksum_derivation = "0x102 + 0x81(CMD) + 0x08(LEN) + (0x38 + 0x01) = 0x1C4 -> & 0xFF = 0xC4"
observed = true

[[response]]
name = "get_info_reply_caps_on"
cmd = 0x81
payload_meaning = "Same as get_info_reply but lockBits = 0x02, i.e. CapsLock lit on the target."
data = [0x38, 0x01, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00]
len = 0x08
frame = "57 AB 00 81 08 38 01 02 00 00 00 00 00 C6"
checksum = 0xC6
checksum_derivation = "0x102 + 0x81(CMD) + 0x08(LEN) + (0x38 + 0x01 + 0x02) = 0x1C6 -> & 0xFF = 0xC6"
observed = true

