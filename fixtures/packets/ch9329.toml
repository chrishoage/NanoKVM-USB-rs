# CH9329 packet fixtures, derived independently of the Rust encoder.
#
# Frame: 57 AB ADDR CMD LEN DATA[LEN] SUM
# SUM = (0x57 + 0xAB + ADDR + CMD + LEN + sum(DATA)) & 0xFF
# ADDR is zero throughout, giving a constant checksum contribution of 0x102.
#
# Tests read these bytes directly to avoid copying encoder mistakes into expectations.
# `observed = true` records a matching hardware observation. Unless `observed_on`
# says otherwise, observations came from the 2026-09-09 protocol investigation.
# USB-string frames were recorded by `nanokvm devices --probe` on 2026-09-11.
# See docs/protocol.md and docs/hardware.md for interpretation and evidence limits.
# Disagreements below preserve malformed replies and target-effect observations.

[meta]
device = "NanoKVM-USB (Sipeed) / CH9329 over CH343 CDC-ACM bridge"
addr = 0x00
head = [0x57, 0xAB]
checksum_formula = "SUM = (HEAD1 + HEAD2 + ADDR + CMD + LEN + sum(DATA)) & 0xFF"
checksum_constant = "0x57 + 0xAB + 0x00 = 0x102"
serial = "57600 baud, 8N1; hardware-verified (docs/protocol.md)"

