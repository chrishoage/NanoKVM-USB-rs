# --------------------------------------------------------------------------
# Where the wire disagreed with the documented frame format.
# Per §9.1 a disagreement is a finding, not a test to make pass.
# --------------------------------------------------------------------------

[[disagreement]]
name = "unknown_command_reply_has_no_checksum_byte"
trigger = "57 AB 00 7E 00 80   (well-formed frame, undefined command 0x7E)"
derived_reply = "57 AB 00 FE 00 00   (6 bytes: CMD 0x7E|0x80, LEN 0x00, SUM = 0x102 + 0xFE + 0x00 = 0x200 -> & 0xFF = 0x00)"
observed_reply = "57 AB 00 FE 00      (5 bytes -- no SUM byte at all)"
note = """
The device replies to an undefined command with a FIVE byte frame: header,
addr, CMD 0xFE, LEN 0x00, and then nothing. The frame format requires a
checksum byte even when LEN is 0, so a strict host parser that waits for
6 + LEN bytes will block forever on this reply. Reproduced with a 2 s and a
10 s read window; the sixth byte never arrives, and the next GET_INFO gets
its own correct reply, so the byte is not merely late.
IMPLICATION: the host frame reader needs a read timeout and a resync path,
it cannot be a pure byte counter. It is also a reason never to send an
undefined command speculatively.
"""

[[disagreement]]
name = "device_receive_parser_has_no_inter_byte_timeout"
trigger = "57 AB 00 02 08 00 00   (header claims LEN=8, only 2 payload bytes sent)"
note = """
The CH9329 keeps counting. After gaps of 0, 100, 200, 300, 500, 1000, 2000 and
10000 ms it was still waiting for the remaining 6 payload bytes plus checksum,
and it consumed the next GET_INFO request's bytes as that payload. It then
emitted 57 AB 00 C2 01 E4 A9 (checksum error against CMD 0x02) and only
resynchronised on the request AFTER that.
IMPLICATION: the host must never emit a partial frame. One truncated write
costs the next command as well, and the reply the host then reads belongs to
the wrong request -- so the read path must match replies by CMD, not assume
strict request/response pairing.
"""

[[disagreement]]
name = "mouse_reports_need_a_leading_mode_byte"
trigger = "57 AB 00 04 06 00 <xLo> <xHi> <yLo> <yHi> 00   (6-byte absolute payload, as this file and docs/NATIVE_CLIENT_PLAN.md's appendix originally derived it)"
derived_reply = "cursor moves to the requested position"
observed_reply = "57 AB 00 84 01 00 87  (ACK) and the cursor does not move AT ALL"
note = """
MEASURED ON HARDWARE, docs/stage0/absrange.md. The plan's appendix and the
first version of this file both derived the mouse payloads straight from the
HID report shapes: 4 bytes relative [buttons, dx, dy, wheel] and 6 bytes
absolute [buttons, xLo, xHi, yLo, yHi, wheel]. Both are WRONG on the wire.

The CH9329 mouse commands take a leading MODE byte:
    SEND_MS_ABS_DATA (0x04)  LEN=7  [0x02, buttons, xLo, xHi, yLo, yHi, wheel]
    SEND_MS_REL_DATA (0x05)  LEN=5  [0x01, buttons, dx,  dy,   wheel]

Upstream does this at the SEND SITE, which is why it is invisible in
libs/mouse/index.ts (whose comments this file trusted):
    reference/browser/src/components/mouse/absolute.tsx:166
        await device.sendMouseData([0x02, ...report])
    reference/browser/src/components/mouse/relative.tsx:136
        await device.sendMouseData([0x01, ...report])
    reference/browser/src/libs/device/index.ts:30
        const cmdEvent = report[0] === 0x01 ? SEND_MS_REL_DATA : SEND_MS_ABS_DATA

WHY THIS IS DANGEROUS: the device ACKs the short form. `57 AB 00 84 01 00 87`
comes back for a 6-byte absolute payload exactly as it does for the correct
7-byte one, and the cursor simply never moves. The 4-byte relative payload is
worse: it is silently interpreted one byte to the left, so the target reads
dx from the host's dy byte and dy from the host's wheel byte -- the pointer
moves horizontally when the host asked for vertical motion, and never moves
vertically at all. Both were reproduced on hardware and then fixed by adding
the mode byte.

IMPLICATION: LEN is the only signal that distinguishes the two forms, and the
device does not check it. A byte-count assertion in the encoder (7 and 5) is
the cheap guard, and the §9.1 packet tests must assert against the frames in
this file, which are now the corrected ones.
"""
