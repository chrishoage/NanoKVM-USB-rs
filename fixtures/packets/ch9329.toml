# CH9329 packet examples -- hand-derived from the documented frame format.
#
# FORMAT CHOICE: TOML, not Markdown or JSON.
#   - These are the AUTHORITY for the §9.1 packet tests, so the test should read
#     THIS FILE rather than have a human retype the bytes into Rust source --
#     retyping is exactly where a transcription bug would enter and silently
#     bless a wrong encoder.
#   - TOML has comments, so the derivation reasoning lives next to the data
#     (JSON cannot carry it); it has a schema-ish shape, so a test can
#     deserialize it (Markdown cannot without a parser).
#
# DERIVED, NOT CAPTURED. Every `frame` below was worked out from:
#
#     HEAD1(0x57) HEAD2(0xAB) ADDR CMD LEN DATA[LEN] SUM
#     SUM = (HEAD1 + HEAD2 + ADDR + CMD + LEN + sum(DATA)) & 0xFF
#
# with ADDR = 0x00 throughout, so the constant part of every checksum is
#     0x57 + 0xAB + 0x00 = 0x102
# and therefore
#     SUM = (0x102 + CMD + LEN + sum(DATA)) & 0xFF
#
# `observed = true` means a byte-identical frame was also seen on the wire
# during the Stage 0 spike (see fixtures/traffic/). That is CORROBORATION.
# Where derivation and observation disagree, see [[disagreement]] at the end.

[meta]
device = "NanoKVM-USB (Sipeed) / CH9329 over CH343 CDC-ACM bridge"
addr = 0x00
head = [0x57, 0xAB]
checksum_formula = "SUM = (HEAD1 + HEAD2 + ADDR + CMD + LEN + sum(DATA)) & 0xFF"
checksum_constant = "0x57 + 0xAB + 0x00 = 0x102"
serial = "57600 baud, 8N1 -- confirmed on hardware, see docs/stage0/serial.md"

# --------------------------------------------------------------------------
# Requests
# --------------------------------------------------------------------------

[[packet]]
name = "get_info"
cmd = 0x01
cmd_name = "GET_INFO"
payload_meaning = "No payload. Query device version, target-connected flag and lock-key bits."
data = []
len = 0x00
frame = "57 AB 00 01 00 03"
checksum = 0x03
checksum_derivation = "0x102 + 0x01(CMD) + 0x00(LEN) + 0 = 0x103 -> & 0xFF = 0x03"
observed = true

[[packet]]
name = "kb_shift_a_press"
cmd = 0x02
cmd_name = "SEND_KB_GENERAL_DATA"
payload_meaning = "8-byte HID keyboard report: modifier=LShift(1<<1=0x02), reserved=0x00, key0='a/A' HID usage 0x04, key1..key5 empty. This is the report for a shifted 'A'."
data = [0x02, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00]
len = 0x08
frame = "57 AB 00 02 08 02 00 04 00 00 00 00 00 12"
checksum = 0x12
checksum_derivation = "0x102 + 0x02(CMD) + 0x08(LEN) + (0x02 + 0x04) = 0x112 -> & 0xFF = 0x12"
observed = false

