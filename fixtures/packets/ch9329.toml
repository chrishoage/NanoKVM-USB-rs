payload_meaning = "Error reply to GET_INFO (0x01 | 0xC0). Status byte 0xE4 = checksum error. NOTE the last payload byte is NOT 0x00, which is why upstream's off-by-one decode() rejects every error frame -- see docs/stage0/serial.md §3.1."
data = [0xE4]
len = 0x01
frame = "57 AB 00 C1 01 E4 A8"
checksum = 0xA8
checksum_derivation = "0x102 + 0xC1(CMD) + 0x01(LEN) + 0xE4 = 0x2A8 -> & 0xFF = 0xA8"
