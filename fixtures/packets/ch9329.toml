data = [0x00]
len = 0x01
frame = "57 AB 00 82 01 00 85"
checksum = 0x85
checksum_derivation = "0x102 + 0x82(CMD) + 0x01(LEN) + 0x00 = 0x185 -> & 0xFF = 0x85"
